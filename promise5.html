<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function dis(){
            return new Promise((resolve,reject)=>{
                setTimeout(resolve,3000,"Hello")
            })
        }
        async function show() {
            try{
                let res = await dis()
                console.log(res)
            }
            catch(err){
                console.log(err)
            }
        }
        show()
    </script>
</body>
</html>
